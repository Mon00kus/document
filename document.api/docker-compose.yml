#version: '3.8'

services:
  # SQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: document_mssql
    environment:
      - ACCEPT_EULA=Y
      - "MSSQL_SA_PASSWORD=documentPassword123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'documentPassword123!' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
    volumes:
      - mssql_data:/var/opt/mssql

  # Servicio para crear la BD en MSSQL
  mssql-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: document_mssql_setup
    depends_on:
      mssql:
        condition: service_healthy
    command: >
      /bin/bash -c " /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P 'documentPassword123!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'documentdb') BEGIN CREATE DATABASE documentdb; END\" "

  # LocalStack (S3 + Textract)
  localstack:
    image: localstack/localstack
    container_name: document_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,textract
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - "./.docker/localstack-init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack

  # API FastAPI
  api:
    build: .
    container_name: document_api
    depends_on:
      mssql:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Ovrride specific vars if strictly necessary, but .env.docker should suffice.
      # Ensuring AWS endpoint points to localstack service
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mssql_data:
  localstack_data:
